<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TBOP Data Test</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:20px}pre{white-space:pre-wrap;background:#222;padding:15px;border-radius:8px} .ok{color:#7ee787}.bad{color:#ff7b72}</style></head>
<body><h1>TBOP Live Data Test</h1><p>This page checks each live feed independently.</p><div id="out"></div>
<script src="assets/js/live-data.js"></script><script>
const out=document.getElementById("out");
function add(name,ok,data){const h=document.createElement("h2");h.className=ok?"ok":"bad";h.textContent=(ok?"✓ ":"✗ ")+name;out.appendChild(h);const p=document.createElement("pre");p.textContent=typeof data==="string"?data:JSON.stringify(data,null,2).slice(0,5000);out.appendChild(p);}
(async()=>{
 try{add("Open-Meteo weather",true,await BLOWTORCH_LIVE.getWeather())}catch(e){add("Open-Meteo weather",false,String(e))}
 try{add("NOAA solar aggregation",true,await BLOWTORCH_LIVE.getSolar())}catch(e){add("NOAA solar aggregation",false,String(e))}
})();
</script></body></html>
